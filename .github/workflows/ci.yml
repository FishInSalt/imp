# CI — the local quality gates, enforced on every push and PR:
# typecheck (src + tests) → lint → build → test. See package.json scripts.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # engines: node >=20; check the floor and a current major
        node: [20, 24]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: release identity
        run: node scripts/release-guards.mjs identity
      # The script captures npm pack --json's single filename, checks every
      # actual tar entry/mode, then installs and executes offline in a temporary
      # HOME/cache/local prefix and neutral cwd. No global install or npx ink.
      - name: packaging smoke
        run: node scripts/package-smoke.mjs --cache-source "$HOME/.npm"
