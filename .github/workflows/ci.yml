# CI — the local quality gates, enforced on every push and PR:
# typecheck (src + tests) → lint → build → test. See package.json scripts.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # engines: node >=20; check the floor and a current major
        node: [20, 24]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Packaging smoke (node 20 only): the npm tarball must contain dist/ and
      # a runnable bin — guards against "packed without a build" regressions.
      - if: matrix.node == 20
        run: |
          mkdir -p "$RUNNER_TEMP"
          rm -f imp-agent-*.tgz
          npm pack
          tar -tzf imp-agent-*.tgz > "$RUNNER_TEMP/pack-list.txt"
          grep -q "^package/dist/cli.js$" "$RUNNER_TEMP/pack-list.txt"
          grep -q "^package/bin/imp.js$" "$RUNNER_TEMP/pack-list.txt"
          if grep -qE "^package/(src|test|docs)/" "$RUNNER_TEMP/pack-list.txt"; then
            echo "tarball contains src/, test/, or docs/ — check the files field" >&2
            exit 1
          fi
          npm install -g --prefix "$RUNNER_TEMP/imp-smoke" ./imp-agent-*.tgz
          "$RUNNER_TEMP/imp-smoke/bin/imp" --help > /dev/null
