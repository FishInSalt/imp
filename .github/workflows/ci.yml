# CI — the local quality gates, enforced on every push and PR:
# typecheck (src + tests) → lint → build → test. See package.json scripts.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    env:
      CI_REQUIRE_SEARCH_TOOLS: "1"
    strategy:
      fail-fast: false
      matrix:
        # Test the exact supported floor and a current major.
        node: ["22.19.0", 24]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install search test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep fd-find
          mkdir "$RUNNER_TEMP/ink-test-tools"
          ln -s "$(command -v fdfind)" "$RUNNER_TEMP/ink-test-tools/fd"
          echo "$RUNNER_TEMP/ink-test-tools" >> "$GITHUB_PATH"
      - name: verify search test prerequisites
        run: |
          rg --version
          fd --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: release identity
        run: node scripts/release-guards.mjs identity
      # The script captures npm pack --json's single filename, checks every
      # actual tar entry/mode, then installs and executes offline in a temporary
      # HOME/cache/local prefix and neutral cwd. No global install or npx ink.
      - name: packaging smoke
        run: node scripts/package-smoke.mjs --cache-source "$HOME/.npm"
