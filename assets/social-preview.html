<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink — social preview</title>
<!--
  Source for assets/social-preview.png — the repository social preview card
  (GitHub → Settings → Social preview; PNG 1280×640, well under 1 MB).

  Regenerate: take a full-viewport screenshot of this file in headless
  Chrome (1280 wide, deviceScaleFactor 2) and crop it to the top-left
  2560×1280 — the card is always laid out as the top-left 1280×640 region
  regardless of the window height.
-->
<style>
  :root{color-scheme:dark}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{
    position:relative;background:#0b0d12;color:#e8ecf3;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  body::before{content:"";position:absolute;right:-220px;top:-220px;width:760px;height:760px;
    background:radial-gradient(circle,#5eead426,transparent 62%);}
  body::after{content:"";position:absolute;left:-260px;bottom:-320px;width:700px;height:700px;
    background:radial-gradient(circle,#6cb6ff1a,transparent 62%);}
  .frame{position:absolute;inset:0;padding:60px 72px;display:flex;flex-direction:column}
  .kicker{font:600 15px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.26em;text-transform:uppercase;color:#5eead4}
  h1{font-size:108px;line-height:1;letter-spacing:-.035em;font-weight:800;margin-top:20px}
  h1 .cursor{display:inline-block;width:.38em;height:.74em;margin-left:.09em;background:#5eead4;border-radius:4px}
  .tagline{margin-top:20px;font-size:29px;line-height:1.4;color:#c7cfdc;max-width:980px}
  .cmd{margin-top:32px;display:inline-flex;align-items:center;gap:12px;width:max-content;
    background:#12151d;border:1px solid #232b38;border-radius:12px;padding:15px 22px;
    font:500 21px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#dde5f0}
  .cmd .ps1{color:#5eead4}
  .meta{margin-top:auto;padding-top:26px;border-top:1px solid #1c2330;
    font:15px/2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#8391a5}
  .meta .sep{color:#3a4557;padding:0 6px}
</style>
</head>
<body>
<div class="frame">
  <div class="kicker">Ink · terminal AI agent</div>
  <h1>ink<span class="cursor"></span></h1>
  <p class="tagline">An open-source AI assistant and agent harness for the terminal.</p>
  <div class="cmd"><span class="ps1">$</span>npm install -g ink-agent</div>
  <div class="meta">
    <div>sessions<span class="sep">·</span>extensions<span class="sep">·</span>skills<span class="sep">·</span>subagents<span class="sep">·</span>MCP</div>
    <div>Anthropic<span class="sep">·</span>OpenAI<span class="sep">·</span>GLM<span class="sep">·</span>DeepSeek<span class="sep">·</span>Kimi</div>
  </div>
</div>
</body>
</html>
